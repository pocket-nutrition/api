spring.application.name=api

# Elasticsearch — override via env var SPRING_ELASTICSEARCH_URIS in k8s
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://elasticsearch:9200}

# ML service — override via env var ML_SERVICE_URL in k8s
ml.service.url=${ML_SERVICE_URL:http://pocket-nutrition-ml:8000}

# Nutrition cache — set NUTRITION_CACHE_ENABLED=false to bypass Elasticsearch cache entirely
nutrition.cache.enabled=${NUTRITION_CACHE_ENABLED:true}

# PostgreSQL (ingredients catalogue) — override via env vars in k8s
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://postgresql:5432/pocket_nutrition}
spring.datasource.username=${DATASOURCE_USERNAME:pocket_nutrition}
spring.datasource.password=${DATASOURCE_PASSWORD:changeme}
spring.datasource.hikari.initialization-fail-timeout=-1

# JPA — read-only access to off_products; never manage schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Explicit dialect avoids JDBC metadata fetch at startup (needed when DB may be unavailable)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway — manages ONLY the feature-owned feedback_report table. Hibernate still never manages schema.
# baseline-version=0 so the V1 migration is applied on the already-populated (data-loaded) database.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Feedback — optional salt to hash client IPs before storage. Rate-limiting is NOT implemented in the MVP.
feedback.ip-hash-salt=${FEEDBACK_IP_HASH_SALT:}

# Actuator
management.endpoints.web.exposure.include=health

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Published contract version, surfaced as info.version in /v3/api-docs.
# Bump on every contract change: minor for additive, major for breaking.
# Mobile clients pin a snapshot of this document and cannot be updated in lockstep with the
# server, so this is their only compatibility coordinate. See contract/openapi.json.
pn.contract.version=${PN_CONTRACT_VERSION:1.3.0}
