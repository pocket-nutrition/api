# Test overrides — external services are mocked, these values are never actually used
spring.elasticsearch.uris=http://localhost:9200
ml.service.url=http://localhost:8001
spring.datasource.url=jdbc:postgresql://localhost:5432/pocket_nutrition
spring.datasource.hikari.initialization-fail-timeout=-1
# PostgreSQL is unavailable during tests — keep Flyway from attempting to migrate on context startup.
spring.flyway.enabled=false
# This file shadows src/main/resources/application.properties on the test classpath, so the
# contract version must be repeated here or OpenApiConfig cannot be constructed.
# Keep it equal to the main value: OpenApiSnapshotTest asserts the committed
# contract/openapi.json carries this exact version.
pn.contract.version=1.3.0
